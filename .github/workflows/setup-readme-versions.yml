name: setup-readme-versions

on:
  workflow_call:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest released version
        id: versions
        run: |
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="none"
          else
            VERSION="${LATEST_TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest released version: $VERSION"

      - name: Replace README version block
        run: |
          VERSION="${{ steps.versions.outputs.version }}"

          {
            printf '## 🚀 ACTUAL VERSIONS\n\n'
            if [ "$VERSION" = "none" ]; then
              printf -- '- no releases yet\n'
            else
              printf -- '- `%s`\n' "$VERSION"
            fi
            printf '\n'
          } > block.tmp

          if grep -q '^## 🚀 ACTUAL VERSIONS' README.md; then
            awk '
              /^## 🚀 ACTUAL VERSIONS/ {
                while ((getline line < "block.tmp") > 0) print line
                skipping = 1
                next
              }
              skipping && /^## / { skipping = 0 }
              !skipping { print }
            ' README.md > README.tmp
          else
            cat block.tmp README.md > README.tmp
          fi

          rm -f block.tmp

          if cmp -s README.tmp README.md; then
            echo "No changes detected in README.md"
          else
            mv README.tmp README.md
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add README.md
            git commit -m "docs(readme): update actual versions"
            git push origin "${{ github.event.repository.default_branch }}"
          fi
          rm -f README.tmp