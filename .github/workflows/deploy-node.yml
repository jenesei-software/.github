name: deploy-node

on:
  workflow_call:
    inputs:
      version_type:
        description: "major | minor | patch | none (keep current)"
        required: false
        default: "none"
        type: string
      explicit_version:
        description: "Explicit version, overrides version_type"
        required: false
        type: string
      package_manager:
        description: "npm | yarn | bun | pnpm"
        required: false
        default: "npm"
        type: string
      check_command:
        description: "Check command, empty skips checks"
        required: false
        default: "check"
        type: string
      changelog_preset:
        description: "conventional-changelog preset, empty disables changelog"
        required: false
        default: "angular"
        type: string
    secrets:
      ACCESS_GITHUB_TOKEN:
        required: true
    outputs:
      version:
        description: "Released version"
        value: ${{ jobs.setup-version.outputs.version }}
      tag:
        description: "Released tag"
        value: ${{ jobs.setup-version.outputs.tag }}

permissions:
  contents: write

jobs:
  setup-version:
    uses: jenesei-software/.github/.github/workflows/setup-version.yml@main
    with:
      version_type: ${{ inputs.version_type }}
      explicit_version: ${{ inputs.explicit_version }}
      package_manager: ${{ inputs.package_manager }}
      check_command: ${{ inputs.check_command }}
      changelog_preset: ${{ inputs.changelog_preset }}
    secrets:
      ACCESS_GITHUB_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}