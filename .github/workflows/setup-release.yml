name: setup-release

on:
  workflow_call:
    inputs:
      version_type:
        description: "major | minor | patch | none (keep current)"
        required: false
        default: "none"
        type: string
      explicit_version:
        description: "Explicit version, overrides version_type"
        required: false
        type: string
      package_manager:
        description: "npm | yarn | bun | pnpm"
        required: false
        default: "npm"
        type: string
      check_command:
        description: "Check command, empty skips checks"
        required: false
        default: "check"
        type: string
      changelog_preset:
        description: "conventional-changelog preset, empty disables changelog"
        required: false
        default: "angular"
        type: string
    secrets:
      ACCESS_GITHUB_TOKEN:
        required: true
    outputs:
      version:
        description: "Released version"
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: "Released tag"
        value: ${{ jobs.release.outputs.tag }}
      sha:
        description: "Commit the release points at"
        value: ${{ jobs.release.outputs.sha }}

permissions:
  packages: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    env:
      PACKAGE_MANAGER: ${{ inputs.package_manager }}
      CHECK_COMMAND: ${{ inputs.check_command }}
      CHANGELOG_PRESET: ${{ inputs.changelog_preset }}
      EXPLICIT_VERSION: ${{ inputs.explicit_version }}
      VERSION_TYPE: ${{ inputs.version_type }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup pnpm
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup npmrc for GitHub Packages
        run: |
          touch ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.ACCESS_GITHUB_TOKEN }}" >> ~/.npmrc
          echo "@jenesei-software:registry=https://npm.pkg.github.com/" >> ~/.npmrc
        env:
          NPM_CONFIG_USERCONFIG: ~/.npmrc

      - name: Install dependencies
        env:
          NPM_CONFIG_USERCONFIG: ~/.npmrc
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *) echo "::error::Unknown package manager: $PACKAGE_MANAGER"; exit 1 ;;
          esac

      - name: Run checks
        if: inputs.check_command != ''
        env:
          NPM_CONFIG_USERCONFIG: ~/.npmrc
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s['${{ inputs.check_command }}'] ? 0 : 1);"; then
            case "$PACKAGE_MANAGER" in
              npm) npm run "${{ inputs.check_command }}" ;;
              yarn) yarn "${{ inputs.check_command }}" ;;
              bun) bun run "${{ inputs.check_command }}" ;;
              pnpm) pnpm run "${{ inputs.check_command }}" ;;
            esac
          else
            echo "::warning::No '${{ inputs.check_command }}' script, skipping checks"
          fi

      - name: Generate changelog
        if: inputs.changelog_preset != ''
        run: npx --yes conventional-changelog-cli -p "$CHANGELOG_PRESET" -i CHANGELOG.md -s
        continue-on-error: true

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          BASE=$(printf '%s' "$CURRENT" | sed 's/-.*//')

          if [ -n "$EXPLICIT_VERSION" ]; then
            VERSION=$(printf '%s' "$EXPLICIT_VERSION" | sed 's/^v//; s/-.*//')
          elif [ "$VERSION_TYPE" != "none" ]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            case "$VERSION_TYPE" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *) echo "::error::Unknown version type: $VERSION_TYPE"; exit 1 ;;
            esac
          else
            VERSION="$BASE"
          fi

          TAG="v$VERSION"

          if git tag -l "$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists. Bump version_type or set explicit_version."
            exit 1
          fi

          echo "Releasing $TAG (was $CURRENT, branch $BRANCH_NAME)"
  
            if [ "$VERSION" = "$CURRENT" ]; then
              echo "Version already $CURRENT, skipping npm version"
            else
              npm version "$VERSION" --no-git-tag-version
            fi
  
            git add package.json
          [ -f CHANGELOG.md ] && git add CHANGELOG.md || true

          if git diff --cached --quiet; then
            echo "Nothing to commit, tag will point at the current commit"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git commit -m "chore(release): $TAG"
            git push origin "HEAD:$BRANCH_NAME"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}
        run: |
          if [ -f CHANGELOG.md ]; then
            gh release create "${{ steps.bump.outputs.tag }}" \
              --title "${{ steps.bump.outputs.tag }}" \
              --target "${{ steps.bump.outputs.sha }}" \
              --notes-file CHANGELOG.md
          else
            gh release create "${{ steps.bump.outputs.tag }}" \
              --title "${{ steps.bump.outputs.tag }}" \
              --target "${{ steps.bump.outputs.sha }}" \
              --generate-notes
          fi