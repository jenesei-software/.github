name: deploy-library

on:
  workflow_call:
    inputs:
      version_type:
        description: "major | minor | patch | none (keep current)"
        required: false
        default: "patch"
        type: string
      explicit_version:
        description: "Explicit version, overrides version_type"
        required: false
        type: string
      registry_type:
        description: "npm | github | all"
        required: false
        default: "github"
        type: string
      package_manager:
        description: "npm | yarn | bun | pnpm"
        required: false
        default: "npm"
        type: string
      check_command:
        description: "Check command, empty skips checks"
        required: false
        default: "check"
        type: string
      changelog_preset:
        description: "conventional-changelog preset, empty disables changelog"
        required: false
        default: "angular"
        type: string
    secrets:
      NPM_TOKEN:
        required: false
      ACCESS_GITHUB_TOKEN:
        required: true
    outputs:
      version:
        description: "Released version"
        value: ${{ jobs.setup-version.outputs.version }}
      tag:
        description: "Released tag"
        value: ${{ jobs.setup-version.outputs.tag }}

permissions:
  contents: write

jobs:
  setup-version:
    uses: jenesei-software/.github/.github/workflows/setup-version.yml@main
    with:
      version_type: ${{ inputs.version_type }}
      explicit_version: ${{ inputs.explicit_version }}
      package_manager: ${{ inputs.package_manager }}
      check_command: ${{ inputs.check_command }}
      changelog_preset: ${{ inputs.changelog_preset }}
    secrets:
      ACCESS_GITHUB_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}

  publish:
    needs: [setup-version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup-version.outputs.version }}
      REGISTRY_TYPE: ${{ inputs.registry_type }}
      ACCESS_GITHUB_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup-version.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org

      - name: Configure npm for GitHub Packages
        if: inputs.registry_type == 'github' || inputs.registry_type == 'all'
        run: echo "//npm.pkg.github.com/:_authToken=$ACCESS_GITHUB_TOKEN" >> ~/.npmrc

      - name: Check GitHub Packages version
        id: check_github
        if: inputs.registry_type == 'github' || inputs.registry_type == 'all'
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME" versions --registry https://npm.pkg.github.com --json 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check NPM version
        id: check_npm
        if: inputs.registry_type == 'npm' || inputs.registry_type == 'all'
        run: |
          NAME=$(node -p "require('./package.json').name")
          if [ -z "$NPM_TOKEN" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is empty, skipping npmjs.org"
          elif npm view "$NAME" versions --json 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.check_github.outputs.publish == 'true'
        run: npm publish --registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ACCESS_GITHUB_TOKEN }}

      - name: Publish to NPM Registry
        if: steps.check_npm.outputs.publish == 'true'
        run: npm publish --access public --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}